# cargo-deny 配置
#
# 目的：防止误引入 `crispy-*` 这类 CC-BY-NC-SA（非商业）协议 crate —— 见 docs/03 ADR-007。

[advisories]
version = 2
ignore = []

[licenses]
version = 2
# 允许 MIT / Apache-2.0 / BSD / ISC / MPL / LGPL / GPL 等常见开源协议
# 明确排除 CC-BY-NC-SA（非商业）—— 它不出现在 allow 列表里就会被拒绝
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unlicense",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "LGPL-2.1-or-later",
    "GPL-3.0-or-later",
    "OFL-1.1",
]
confidence-threshold = 0.8
# 允许列表里声明但当前未用到的协议只警告不失败（避免每次依赖变动都要改 allowlist）
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
