name: IQTV Lite Build & Release

permissions:
  contents: write   # 允许 push tag 时创建 Release 并上传 APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      isolated_test_package:
        description: Build separate validation applicationId for instrumentation checks
        type: boolean
        default: true
      build_release_apk:
        description: Build official production APK (tv.iqtvlite.app) and upload as artifact
        type: boolean
        default: true
      release_version:
        description: Production versionName (e.g. 0.1.0, 0.2.0)
        type: string
        default: '0.1.0'
      release_version_code:
        description: Production versionCode integer (e.g. 100, 101)
        type: string
        default: '100'
      publish_github_release:
        description: Also publish GitHub Releases (v<version> & latest; requires RELEASE_KEYSTORE_* secrets)
        type: boolean
        default: false
      build_ffmpeg_audio:
        description: Also build the Media3 FFmpeg audio-only decoder AAR (MP2/MP3 fallback), upload as artifact
        type: boolean
        default: false

jobs:
  build-apk:
    name: Build IQTV Lite APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Rust → Android .so ────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # ubuntu-latest 自带 NDK，但显式 setup 保证版本一致（r27 足够，
      # 我们没用 Slint 的 Skia，所以不受 slint#14824 的 r30 要求限制）
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27

      - name: Build Rust core for Android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/iqtvlite-android-r27-fresh
        run: |
          cat "$ANDROID_NDK_HOME/source.properties"
          cargo ndk \
            -t arm64-v8a -t armeabi-v7a -P 24 \
            -o android/app/src/main/jniLibs \
            build --release --locked -p iqtvlite-capi

      # ── Android APK ───────────────────────────────────────────────────
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # 稳定签名（同证书可覆盖升级；正式发版推荐配 RELEASE_KEYSTORE_*，并兼容 VALIDATION_* / ANDROID_SIGNING_*）。
      - name: Prepare stable release / validation signing (optional)
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          VALIDATION_KEYSTORE_BASE64: ${{ secrets.VALIDATION_KEYSTORE_BASE64 }}
          LEGACY_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          VALIDATION_KEYSTORE_PASSWORD: ${{ secrets.VALIDATION_KEYSTORE_PASSWORD }}
          LEGACY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          VALIDATION_KEY_ALIAS: ${{ secrets.VALIDATION_KEY_ALIAS }}
          LEGACY_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VALIDATION_KEY_PASSWORD: ${{ secrets.VALIDATION_KEY_PASSWORD }}
          LEGACY_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -u
          keystore_b64="${RELEASE_KEYSTORE_BASE64:-${VALIDATION_KEYSTORE_BASE64:-${LEGACY_KEYSTORE_BASE64:-}}}"
          store_password="${RELEASE_KEYSTORE_PASSWORD:-${VALIDATION_KEYSTORE_PASSWORD:-${LEGACY_KEYSTORE_PASSWORD:-}}}"
          key_alias="${RELEASE_KEY_ALIAS:-${VALIDATION_KEY_ALIAS:-${LEGACY_KEY_ALIAS:-}}}"
          key_password="${RELEASE_KEY_PASSWORD:-${VALIDATION_KEY_PASSWORD:-${LEGACY_KEY_PASSWORD:-}}}"

          if [ -z "$keystore_b64" ] && [ -z "$store_password" ] && [ -z "$key_alias" ] && [ -z "$key_password" ]; then
            echo "::notice::No signing secrets configured -> runner ephemeral debug keystore (ephemeral certificate)."
            echo "stable_signing=false" >> "$GITHUB_OUTPUT"
            {
              echo "### APK signing"
              echo ""
              echo "- Secrets: **not configured** (RELEASE_KEYSTORE_BASE64 / RELEASE_KEYSTORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD)"
              echo "- Keystore: ephemeral Android debug keystore, regenerated on every run"
              echo "- In-place upgrade across runs: **not possible** (\`INSTALL_FAILED_UPDATE_INCOMPATIBLE\`)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # 部分配置 = 配置错误；宁可红也不要静默回退到每次都会变的 debug keystore。
          missing=""
          [ -n "$keystore_b64" ]   || missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -n "$store_password" ] || missing="$missing RELEASE_KEYSTORE_PASSWORD"
          [ -n "$key_alias" ]      || missing="$missing RELEASE_KEY_ALIAS"
          [ -n "$key_password" ]   || missing="$missing RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Signing is partially configured. Missing:$missing (set all four secrets or none)."
            exit 1
          fi

          umask 077
          keystore="$RUNNER_TEMP/validation-signing.keystore"
          printf '%s' "$keystore_b64" | tr -d ' \t\r\n' | base64 --decode > "$keystore"
          if [ ! -s "$keystore" ]; then
            echo "::error::Decoded validation keystore is empty; check the VALIDATION_KEYSTORE_BASE64 secret."
            exit 1
          fi
          # 口令/别名错误在这里就红，避免产出一个用错密钥签名的 APK。
          keytool -list -keystore "$keystore" -storepass "$store_password" -alias "$key_alias" > /dev/null

          {
            echo "VALIDATION_KEYSTORE_FILE=$keystore"
            echo "VALIDATION_KEYSTORE_PASSWORD=$store_password"
            echo "VALIDATION_KEY_ALIAS=$key_alias"
            echo "VALIDATION_KEY_PASSWORD=$key_password"
          } >> "$GITHUB_ENV"
          echo "stable_signing=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Stable validation signing enabled (keystore alias: $key_alias)."

      - name: Build debug APK
        working-directory: android
        # t11: push 触发没有 inputs（默认空），必须回退到 dispatch 的默认 true（隔离验证包），
        # 否则非隔离包不走 instrumentation-shared-keep.pro，pair gate 会因 R8 收缩而失败。
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest -PISOLATED_TEST_PACKAGE=${{ github.event.inputs.isolated_test_package || 'true' }} --stacktrace

      - name: Verify APK contains Rust .so
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/verify_apk.py "$APK"
          python3 scripts/check_brand_assets.py
          python3 scripts/check_logo_webp.py
          python3 scripts/check_info_card.py
          python3 scripts/check_settings_ia.py
          python3 scripts/check_settings_scroll.py
          python3 scripts/check_perf_policy.py
          python3 scripts/check_jingcai_timeline.py
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E 'package:|native-code:|sdkVersion|targetSdkVersion|application-label:'
          TEST_APK=android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -s "$TEST_APK"
          python3 -m unittest discover -s scripts -p test_dex_contract.py
          python3 scripts/verify_instrumentation_pair.py "$APK" "$TEST_APK" --report android/app/build/reports/instrumentation-contract.json
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$TEST_APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$TEST_APK" AndroidManifest.xml | grep -E 'targetPackage|AndroidJUnitRunner'
          for ABI in armeabi-v7a arm64-v8a; do
            LIB="android/app/src/main/jniLibs/$ABI/libiqtvlite_capi.so"
            for METHOD in version parseM3u stableId parseXmltvFile; do
              "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D "$LIB" | grep "Java_tv_iqtvlite_app_RustBridge_${METHOD}$"
            done
            "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" --notes "$LIB"
          done
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}

      # 签名稳定性断言 + 每 run 可对比的证书指纹（Step Summary + reports artifact）。
      # 1) 主包与 androidTest 包必须同一证书；2) 配了固定 keystore 时 APK 证书必须等于
      # keystore 证书 —— 这两条保证后续每个 run 的 APK 都能被同一个已装包覆盖升级。
      # （配合 keystore 配置时：VALIDATION_* 由上一步写入 $GITHUB_ENV，本步直接可见）
      - name: Verify APK signing certificate
        run: |
          set -u
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          apk_cert=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'certificate SHA-256 digest' | sed 's/.*digest: //' | tr -d '[:space:]' | tr 'A-F' 'a-f')
          test_cert=$("$APKSIGNER" verify --print-certs "$TEST_APK" | grep -m1 'certificate SHA-256 digest' | sed 's/.*digest: //' | tr -d '[:space:]' | tr 'A-F' 'a-f')
          echo "debug APK signer sha256: $apk_cert"
          echo "androidTest APK signer sha256: $test_cert"
          if [ -z "$apk_cert" ] || [ "$apk_cert" != "$test_cert" ]; then
            echo "::error::Main APK and androidTest APK are not signed by the same certificate; the validation pair is unusable."
            exit 1
          fi

          keystore_cert=""
          if [ -n "${VALIDATION_KEYSTORE_FILE:-}" ] && [ -n "${VALIDATION_KEYSTORE_PASSWORD:-}" ] && [ -n "${VALIDATION_KEY_ALIAS:-}" ]; then
            keytool -exportcert -rfc \
              -keystore "$VALIDATION_KEYSTORE_FILE" \
              -storepass "$VALIDATION_KEYSTORE_PASSWORD" \
              -alias "$VALIDATION_KEY_ALIAS" > "$RUNNER_TEMP/validation-signing.pem" 2>/dev/null || true
            keystore_cert=$(openssl x509 -in "$RUNNER_TEMP/validation-signing.pem" -noout -fingerprint -sha256 2>/dev/null | sed 's/.*=//' | tr -d ':' | tr 'A-F' 'a-f' || true)
            if [ -z "$keystore_cert" ]; then
              echo "::warning::Could not derive the configured keystore certificate fingerprint; skipping the stability assertion for this run."
            elif [ "$apk_cert" != "$keystore_cert" ]; then
              echo "::error::APK signer $apk_cert does not match the configured validation keystore certificate $keystore_cert."
              exit 1
            fi
          fi

          {
            echo "### APK signing certificate"
            echo ""
            echo "| Item | SHA-256 |"
            echo "| --- | --- |"
            echo "| debug APK signer | \`$apk_cert\` |"
            echo "| androidTest APK signer | \`$test_cert\` |"
            if [ -n "${VALIDATION_KEYSTORE_FILE:-}" ]; then
              echo "| configured keystore cert | \`${keystore_cert:-unavailable}\` |"
              echo ""
              echo "Stable validation signing is **active**: this fingerprint must be identical in every run, so \`adb install -r\` keeps working without uninstalling."
            else
              echo ""
              echo "Stable release/validation signing is **not configured**: the debug keystore is regenerated per run, so APKs from different runs cannot be installed over each other (see docs/RELEASE_SIGNING.md)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p android/app/build/reports
          printf 'debug-apk-sha256: %s\nandroidtest-apk-sha256: %s\nconfigured-keystore-sha256: %s\n' \
            "$apk_cert" "$test_cert" "${keystore_cert:-none}" | tee android/app/build/reports/signing-certificate.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iqtvlite-test-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 90
          if-no-files-found: error

      - name: Upload Android validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iqtvlite-android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/outputs/mapping/debug/
            android/app/build/outputs/apk/**/output-metadata.json
          retention-days: 90
          if-no-files-found: warn

      - name: Ensure signing secrets configured before official release build
        if: github.event_name == 'workflow_dispatch' && inputs.build_release_apk
        run: |
          if [ "${{ steps.signing.outputs.stable_signing }}" != "true" ]; then
            echo "::error::Missing release signing secrets. Configure RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, and RELEASE_KEY_PASSWORD in GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Build official release APK (manual dispatch)
        id: release_build
        if: github.event_name == 'workflow_dispatch' && inputs.build_release_apk
        run: |
          set -eu
          VER_NAME="${{ inputs.release_version }}"
          VER_NAME="${VER_NAME#v}"
          VER_CODE="${{ inputs.release_version_code }}"
          echo "version=$VER_NAME" >> "$GITHUB_OUTPUT"
          (cd android && ./gradlew :app:assembleRelease -PISOLATED_TEST_PACKAGE=false -PAPP_VERSION_NAME="$VER_NAME" -PAPP_VERSION_CODE="$VER_CODE" --stacktrace)
          REL_APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$REL_APK"
          python3 scripts/verify_apk.py "$REL_APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$REL_APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$REL_APK" | grep -E 'package:|native-code:|sdkVersion|targetSdkVersion|application-label:'
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp "$REL_APK" "$RUNNER_TEMP/release-assets/IQTV-Lite-v${VER_NAME}.apk"
          cp "$REL_APK" "$RUNNER_TEMP/release-assets/IQTV-Lite-latest.apk"

      - name: Upload official release APK artifact (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.build_release_apk
        uses: actions/upload-artifact@v4
        with:
          name: iqtvlite-release-apk
          path: |
            ${{ runner.temp }}/release-assets/IQTV-Lite-*.apk
          retention-days: 90
          if-no-files-found: error

      - name: Move rolling latest tag to released commit
        if: github.event_name == 'workflow_dispatch' && inputs.build_release_apk && inputs.publish_github_release
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

      - name: Publish GitHub Release v<version> (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.build_release_apk && inputs.publish_github_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release_build.outputs.version }}
          name: IQTV Lite v${{ steps.release_build.outputs.version }}
          make_latest: true
          files: |
            ${{ runner.temp }}/release-assets/IQTV-Lite-v${{ steps.release_build.outputs.version }}.apk
            ${{ runner.temp }}/release-assets/IQTV-Lite-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release latest (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.build_release_apk && inputs.publish_github_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: IQTV Lite Latest (v${{ steps.release_build.outputs.version }})
          make_latest: false
          files: |
            ${{ runner.temp }}/release-assets/IQTV-Lite-latest.apk
            ${{ runner.temp }}/release-assets/IQTV-Lite-v${{ steps.release_build.outputs.version }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ffmpeg-audio:
    name: Build Media3 FFmpeg audio AAR
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_ffmpeg_audio == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake git curl unzip
      - name: Cache FFmpeg source
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/media3/libraries/decoder_ffmpeg/src/main/jni/ffmpeg
          key: ffmpeg-release-6.0-${{ runner.os }}
      - name: Fetch media3 1.11.1
        run: git clone --depth 1 --branch "1.11.1" https://github.com/androidx/media.git media3
      - name: Build FFmpeg + decoder_ffmpeg AAR
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash scripts/build_media3_ffmpeg_audio.sh "$GITHUB_WORKSPACE/media3" "$ANDROID_NDK_HOME" 21
      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: media3-decoder-ffmpeg-aar
          path: |
            media3/**/buildout/outputs/aar/*.aar
            media3/**/build/outputs/aar/*.aar
          if-no-files-found: error