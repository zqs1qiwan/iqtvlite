name: Build Test APK

permissions:
  contents: write   # 允许 push tag 时创建 Release 并上传 APK

on:
  push:
    branches: [main]
    tags: ['v*']          # push v* tag 时构建并自动创建 Release
  pull_request:
  workflow_dispatch:
    inputs:
      isolated_test_package:
        description: Build separate validation applicationId without replacing installed data
        type: boolean
        default: true
      build_ffmpeg_audio:
        description: Also build the Media3 FFmpeg audio-only decoder AAR (MP2/MP3 fallback), upload as artifact
        type: boolean
        default: false

jobs:
  build-apk:
    name: Build iqtvlite test APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Rust → Android .so ────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # ubuntu-latest 自带 NDK，但显式 setup 保证版本一致（r27 足够，
      # 我们没用 Slint 的 Skia，所以不受 slint#14824 的 r30 要求限制）
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27

      - name: Build Rust core for Android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/iqtvlite-android-r27-fresh
        run: |
          cat "$ANDROID_NDK_HOME/source.properties"
          cargo ndk \
            -t arm64-v8a -t armeabi-v7a -P 24 \
            -o android/app/src/main/jniLibs \
            build --release --locked -p iqtvlite-capi

      # ── Android APK ───────────────────────────────────────────────────
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Prepare stable signing when configured
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/iqtv-signing.keystore"
            echo "ANDROID_SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/iqtv-signing.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest -PISOLATED_TEST_PACKAGE=${{ inputs.isolated_test_package || false }} --stacktrace

      - name: Verify APK contains Rust .so
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/verify_apk.py "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E 'package:|native-code:|sdkVersion|targetSdkVersion|application-label:'
          TEST_APK=android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -s "$TEST_APK"
          python3 -m unittest discover -s scripts -p test_dex_contract.py
          python3 scripts/verify_instrumentation_pair.py "$APK" "$TEST_APK" --report android/app/build/reports/instrumentation-contract.json
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$TEST_APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$TEST_APK" AndroidManifest.xml | grep -E 'targetPackage|AndroidJUnitRunner'
          for ABI in armeabi-v7a arm64-v8a; do
            LIB="android/app/src/main/jniLibs/$ABI/libiqtvlite_capi.so"
            for METHOD in version parseM3u stableId parseXmltvFile; do
              "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D "$LIB" | grep "Java_tv_iqtvlite_app_RustBridge_${METHOD}$"
            done
            "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" --notes "$LIB"
          done
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iqtvlite-test-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 90
          if-no-files-found: error

      - name: Upload Android validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iqtvlite-android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/outputs/mapping/debug/
            android/app/build/outputs/apk/**/output-metadata.json
          retention-days: 90
          if-no-files-found: warn

      - name: Create GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ffmpeg-audio:
    name: Build Media3 FFmpeg audio AAR
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_ffmpeg_audio == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake git curl unzip
      - name: Cache FFmpeg source
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/media3/libraries/decoder_ffmpeg/src/main/jni/ffmpeg
          key: ffmpeg-release-6.0-${{ runner.os }}
      - name: Fetch media3 1.11.1
        run: git clone --depth 1 --branch "1.11.1" https://github.com/androidx/media.git media3
      - name: Build FFmpeg + decoder_ffmpeg AAR
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash scripts/build_media3_ffmpeg_audio.sh "$GITHUB_WORKSPACE/media3" "$ANDROID_NDK_HOME" 21
      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: media3-decoder-ffmpeg-aar
          path: |
            media3/**/buildout/outputs/aar/*.aar
            media3/**/build/outputs/aar/*.aar
          if-no-files-found: error