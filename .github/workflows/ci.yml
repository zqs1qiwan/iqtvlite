name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # 体积门禁的基线（KB），随 release 更新
  CORE_LIB_BUDGET_KB: 4096

jobs:
  # ── 核心层：最快反馈，不需要任何 Android 工具链 ──────────────────────
  core:
    name: core (build + test + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: license audit
        # 防止误引入 CC-BY-NC-SA 类非商业协议（见 docs/03 ADR-007）
        run: |
          cargo install cargo-deny --locked
          cargo deny check licenses

  # Android APK 构建在 apk.yml 工作流里（ ubuntu runner 自带 NDK）。
  # 本工作流只做纯 Rust 层的快速验证 + 许可审计。

  # Current APK ships Media3 only. Manual CI must not create unrelated libmpv update branches.
