[workspace]
resolver = "2"
members = [
    "crates/iqtvlite-core",
    "crates/iqtvlite-store",
    "crates/iqtvlite-epg",
    "crates/iqtvlite-net",
    "crates/iqtvlite-tvfocus",
    "crates/iqtvlite-player",
    "crates/iqtvlite-capi",
    "crates/iqtvlite-dvr",
    "crates/iqtvlite-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/iqtvlite/iqtvlite"

[workspace.dependencies]
iqtvlite-core = { path = "crates/iqtvlite-core" }
iqtvlite-store = { path = "crates/iqtvlite-store" }
iqtvlite-epg = { path = "crates/iqtvlite-epg" }
iqtvlite-net = { path = "crates/iqtvlite-net" }
iqtvlite-tvfocus = { path = "crates/iqtvlite-tvfocus" }
iqtvlite-player = { path = "crates/iqtvlite-player" }
iqtvlite-dvr = { path = "crates/iqtvlite-dvr" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
quick-xml = "0.42"
url = "2.5"
# jiff 而不是 time：time 0.3 没有 IANA 时区支持，而 Xtream 时移换算必需
# （server_info.timezone → 本地墙钟时间），且 jiff 对 DST 边界的处理是正确的
jiff = { version = "0.2", default-features = false, features = ["std", "static-tz", "serde"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
base64 = "0.23"
percent-encoding = "2"
rusqlite = { version = "0.42", features = ["bundled"] }
# reqwest 0.13 把 `rustls-tls` 改名成了 `rustls`
#
# 【重要】用 `rustls-no-provider` + 显式指定 `ring`：
# rustls 的默认 provider 是 aws-lc-rs，它需要 cmake 构建 → Android NDK 交叉编译是噩梦。
# ring 只需要 NDK 自带的 clang，Android 上有大量先例。
#
# 用 webpki-roots（内置 Mozilla CA 包）而不是 rustls-native-certs
# —— Android 上系统证书路径不可靠。
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "webpki-roots",
    "gzip",
    "brotli",
    "stream",
    "json",
    "http2",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.13"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false

# 仅用于本地开发测量，不影响 release 产物
[profile.bench]
opt-level = 1
